<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#11161B" />
    <meta name="apple-mobile-web-app-title" content="CHC Artists" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>CHC Artists</title>
    <style id="expo-reset">
      html,
      body,
      #root {
        height: 100%;
        background-color: #11161B;
      }
      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        flex: 1;
      }
      /* Follow Safari's visible viewport as its toolbars expand or collapse. */
      @supports (height: 100dvh) {
        body {
          height: 100dvh;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run CHC Artists.</noscript>
    <div id="root"></div>
  </body>
</html>
